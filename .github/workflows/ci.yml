name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-test-only
          POSTGRES_DB: tka_patient_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d tka_patient_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify project status update
        env:
          STATUS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          STATUS_HEAD_SHA: ${{ github.sha }}
        run: npm run check:status

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

      - name: Run runtime, gateway, and ingestion regression tests
        run: npm test

      - name: Lint application
        run: npm run lint

      - name: Operational and security regression checks
        run: |
          npm run test:ops
          sh deploy/tests/operations-shell.test.sh

      - name: Migrate isolated integration database
        env:
          DATABASE_URL: postgresql://test:isolated-ci-test-only@127.0.0.1:5432/tka_patient_test
        run: npm run db:deploy

      - name: Verify multi-account ownership against PostgreSQL
        env:
          PATIENT_TEST_DATABASE_URL: postgresql://test:isolated-ci-test-only@127.0.0.1:5432/tka_patient_test
        run: node --import tsx --test src/app/api/patient-access/route.integration.test.ts

      - name: Build application
        run: npm run build
