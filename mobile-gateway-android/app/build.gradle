plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.tkarehab.gateway'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.tkarehab.gateway'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    if (findProject(':WitSDK') != null) {
        implementation project(':WitSDK')
    }

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}

