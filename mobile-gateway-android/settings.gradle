pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "TkaMobileGateway"
include ':app'

def witSdkDirectory = file('vendor/WitSDK')
if (witSdkDirectory.exists()) {
    include ':WitSDK'
    project(':WitSDK').projectDir = witSdkDirectory
}

